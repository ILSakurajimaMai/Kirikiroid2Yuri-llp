plugins {
    id 'com.android.application'
}

android {
    // compileSdkVersion PROP_TARGET_SDK_VERSION
    ndkVersion '25.2.9519653'
    buildToolsVersion '33.0.2'
    compileSdkVersion PROP_TARGET_SDK_VERSION.toInteger()
    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_11
//        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.yuri.kirikiri2"
        targetSdkVersion PROP_TARGET_SDK_VERSION
        minSdkVersion PROP_MIN_SDK_VERSION

        ndk {
            abiFilters = []
            abiFilters.addAll(PROP_APP_ABI.split(':').collect{it as String})
        }

        externalNativeBuild {
            if (PROP_BUILD_TYPE == 'cmake') {
                cmake {
                    version '3.22.1'
                    targets 'krkr2yuri'
                    arguments "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
                    cppFlags "-frtti -fexceptions -fsigned-char"
                }
            }
        }
        versionCode 1
        versionName "1.4.0beta"
    }
    signingConfigs {
        release {
            storeFile file('sign.jks')
            def generatedHere = false
            def signPropsFile = file('sign.properties')
            if (!storeFile.exists()) {
                // No signing key in this checkout (fresh fork/CI): generate a
                // local keystore so the APK is still installable.
                def gen = ['keytool', '-genkeypair', '-v',
                           '-keystore', storeFile.absolutePath,
                           '-storepass', 'android', '-keypass', 'android',
                           '-alias', 'androiddebugkey',
                           '-keyalg', 'RSA', '-keysize', '2048',
                           '-validity', '10000',
                           '-dname', 'CN=Android Debug,O=Android,C=US']
                def proc = gen.execute()
                proc.waitFor()
                if (storeFile.exists()) {
                    generatedHere = true
                    println "psbport: generated local keystore at ${storeFile}"
                } else {
                    println "psbport: keystore generation failed: ${proc.text} ${proc.err.text}"
                }
            }
            if (generatedHere) {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storePassword 'android'
            }
            else if (signPropsFile.exists()) {
                Properties signProps = new Properties()
                signProps.load(new FileInputStream(signPropsFile))
                keyAlias signProps['SIGN_KEY_ALIAS']
                keyPassword signProps['SIGN_KEY_PASS']
                storePassword signProps['SIGN_STORE_PASS']
            }
            else {
                def envAlias = System.getenv("SIGN_KEY_ALIAS")
                if ((envAlias == null || envAlias.isEmpty()) && storeFile.exists()) {
                    // Keystore was generated by CI with the fixed debug creds
                    // below (workflow step), but the props file is missing:
                    // use those creds directly instead of empty env values.
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                    storePassword 'android'
                }
                else {
                    keyAlias envAlias
                    keyPassword System.getenv("SIGN_KEY_PASS")
                    storePassword System.getenv("SIGN_STORE_PASS")
                }
            }
            println "psbport: signing release: jks=${storeFile.exists()} props=${signPropsFile.exists()} alias=${keyAlias != null ? keyAlias : '<null>'}"
        }
    }
    buildTypes {
        release {
            debuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
            jniDebuggable true
            jniDebuggable true
            renderscriptDebuggable true
            signingConfig signingConfigs.release
        }
    }

    sourceSets{
        main{
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["java"]
            res.srcDirs = ["res"]
            assets.srcDirs =["../../../assets"]
        }

    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path "cpp/CMakeLists.txt"
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "krkr2yuri_v${defaultConfig.versionName}.apk"
        }
    }
}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':cocos2dx')

    implementation "androidx.documentfile:documentfile:1.0.1"
    //noinspection GradleDependency
    implementation "androidx.activity:activity:1.2.3"
    //noinspection GradleDependency
    implementation "androidx.fragment:fragment:1.3.4"
}
